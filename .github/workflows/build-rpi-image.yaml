name: Build and Push Pi Prod Base

on:
  schedule:
    - cron: '0 0 * * *' # Runs nightly at midnight
  workflow_dispatch:


jobs:
  build-and-push-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Source SBOM
        run: |
          curl -Lo $RUNNER_TEMP/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x $RUNNER_TEMP/sbom-tool
          
          # Adjusted paths to scan the root directory instead of ./brownout
          $RUNNER_TEMP/sbom-tool generate -b ./rpi-base -bc ./rpi-base -pn PiProdBase -pv 1.0.0 -ps SamDornan -nsb https://github.com/${{ github.repository }}/sbom/pi-prod-base -V Verbose

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: base-source-sbom-manifest
          path: ./rpi-base/_manifest

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-prod-base
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./rpi-base
          platforms: linux/arm64
          load: true # Loads into the local Docker daemon instead of pushing
          tags: 'pi-prod-base:local-scan'
          no-cache: true

# Temporarily blocked while we figure out how to get this thing running safely.
#      - name: Run Trivy vulnerability scanner
#        uses: aquasecurity/trivy-action@master
#        with:
#          image-ref: 'pi-prod-base:local-scan'
#          format: 'table'
#          exit-code: '1' # Block pushes on critical or high vulnerability detection.
#          severity: 'CRITICAL,HIGH'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./rpi-base
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}